<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temukan Sesuatu yang Menarik</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0 auto 26px;
      color: #666;
      font-size: 16px;
      line-height: 1.6;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .small {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="icon">✨</div>

      <h1>Temukan Sesuatu yang Menarik</h1>

      <p>
        Jelajahi informasi dan konten pilihan
        yang mungkin menarik untuk kamu.
      </p>

      <a class="button" href="URL-PERANTARA-DI-SINI">
        LIHAT SELENGKAPNYA
      </a>

      <div class="small">
        Klik tombol untuk melanjutkan.
      </div>

    </div>
  </div>

</body>
</html>
